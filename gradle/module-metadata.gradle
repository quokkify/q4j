// Gradle creates structural parent projects (for example :integrations) for
// nested paths. Only projects with an explicit build file are Q4J modules.
def activePaths = subprojects.findAll { it.buildFile.exists() }.collect { it.path } as Set
def configuredPaths = modules.keySet() as Set
def missingMetadata = activePaths - configuredPaths
def unknownMetadata = configuredPaths - activePaths
if (!missingMetadata.empty || !unknownMetadata.empty) {
    throw new GradleException("Q4J module metadata mismatch. Missing: ${missingMetadata}; unknown: ${unknownMetadata}")
}

modules.each { modulePath, metadata ->
    def moduleProject = project(modulePath)
    moduleProject.description = metadata.description
    moduleProject.base.archivesName = metadata.artifactId
    moduleProject.ext.artifactId = metadata.artifactId
    moduleProject.ext.q4jDisplayName = metadata.displayName
}

gradle.projectsEvaluated {
    modules.each { modulePath, metadata ->
        project(modulePath).description = metadata.description
    }
}
