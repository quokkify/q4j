def runnerSettings = rootProject.file('tools/architecture')

subprojects {
    // :architecture is the runner itself, its test fixtures violate the rules on purpose; projects without a
    // build file are structural parents with no code.
    if (path == ':architecture' || !buildFile.exists()) {
        return
    }

    configurations {
        architectureRunner {
            canBeConsumed = false
            canBeResolved = true
        }
    }

    dependencies {
        architectureRunner project(':architecture')
        architectureRunner rootProject.libs.log4j.core
        architectureRunner rootProject.libs.log4j.slf4j2.impl
    }

    // Read lazily, after the module's own build script adjusted its source sets. Every source set other
    // than main counts as tests. Generated sources live under the build directory and are not verified.
    def buildDir = layout.buildDirectory.get().asFile.toPath()
    def authored = { Collection<SourceSet> sets ->
        files({ sets.collect { it.java.sourceDirectories } })
            .filter { it.directory && !it.toPath().startsWith(buildDir) }
    }
    def mainSourceSets = { sourceSets.matching { it.name == SourceSet.MAIN_SOURCE_SET_NAME } }
    def testSourceSets = { sourceSets.matching { it.name != SourceSet.MAIN_SOURCE_SET_NAME } }
    def mainSources = authored(mainSourceSets())
    def testSources = authored(testSourceSets())
    def compiled = { Collection<SourceSet> sets ->
        files({ sets.collect { it.output.classesDirs } })
    }
    def mainClasses = compiled(mainSourceSets())
    def testClasses = compiled(testSourceSets())
    def processed = { Collection<SourceSet> sets ->
        files({ sets.collect { it.output.resourcesDir } })
    }
    def mainResources = processed(mainSourceSets())
    def testResources = processed(testSourceSets())

    def verifiedMarker = layout.buildDirectory.file('architecture/verified')
    def modulePath = path
    def verifyArchitecture = tasks.register('verifyArchitecture', JavaExec) {
        group = 'verification'
        description = 'Verifies the architecture rules registered in tools/architecture against this module.'
        mainClass = 'dev.quokkify.architecture.ArchitectureRunner'
        // The module's runtime classpath only resolves what its classes reference, such as the supertypes and
        // annotations of a dependency; the verified classes are still limited to the class directories below.
        classpath = files(runnerSettings) + configurations.architectureRunner + mainClasses + testClasses +
            files({ sourceSets.collect { it.runtimeClasspath } })
        systemProperty 'architecture.packages', 'dev.quokkify'
        systemProperty 'architecture.module', modulePath
        // Gradle pipes the runner output, so the runner cannot detect the terminal itself. A CI job without
        // --console=plain still gets the plain report through the CI variable most CI services set.
        def consoleOutput = gradle.startParameter.consoleOutput
        def plainConsole = consoleOutput == org.gradle.api.logging.configuration.ConsoleOutput.Plain
        def autoConsole = consoleOutput == org.gradle.api.logging.configuration.ConsoleOutput.Auto
        def isSet = { String name -> !providers.environmentVariable(name).getOrElse('').isBlank() }
        def colored = !plainConsole && !isSet('NO_COLOR') && !(autoConsole && isSet('CI'))
        systemProperty 'architecture.color', colored ? 'always' : 'never'
        inputs.files(mainSources.asFileTree.matching { include '**/*.java' })
            .withPropertyName('mainSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.files(testSources.asFileTree.matching { include '**/*.java' })
            .withPropertyName('testSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
        def failOn = providers.gradleProperty('architecture.fail.on')
        if (failOn.isPresent()) {
            systemProperty 'architecture.fail.on', failOn.get()
        }
        outputs.file(verifiedMarker)
        onlyIf('the module has compiled classes') {
            (mainClasses + testClasses).files.any { it.directory }
        }

        doFirst {
            // Only these directories are verified, so the runner and the dependencies on the classpath are not.
            systemProperty 'architecture.main.classes', mainClasses.files.findAll { it.directory }.join(',')
            systemProperty 'architecture.test.classes', testClasses.files.findAll { it.directory }.join(',')
            systemProperty 'architecture.main.resources', mainResources.files.findAll { it.directory }.join(',')
            systemProperty 'architecture.test.resources', testResources.files.findAll { it.directory }.join(',')
            systemProperty 'architecture.main.sources', mainSources.files.join(',')
            systemProperty 'architecture.test.sources', testSources.files.join(',')
        }
        doLast {
            verifiedMarker.get().asFile.text = 'verified\n'
        }
    }

    tasks.named('check') {
        dependsOn verifyArchitecture
    }
}
