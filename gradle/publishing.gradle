def validateMavenCentralPoms = tasks.register('validateMavenCentralPoms') {
    group = 'verification'
    description = 'Validates generated Maven POMs against Maven Central dependency requirements.'
}

subprojects {
    def metadata = rootProject.q4jModules[path]
    if (metadata == null || metadata.publish == false) {
        return
    }

    apply plugin: 'com.vanniktech.maven.publish'

    mavenPublishing {
        coordinates(rootProject.group.toString(), metadata.artifactId, project.version.toString())
        publishToMavenCentral()
        signAllPublications()

        pom {
            name = metadata.displayName
            description = metadata.description
            inceptionYear = '2026'
            url = 'https://github.com/quokkify/q4j'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'ylazakovich'
                    name = 'Yaraslau Lazakovich'
                    url = 'https://github.com/ylazakovich'
                }
            }

            scm {
                url = 'https://github.com/quokkify/q4j'
                connection = 'scm:git:https://github.com/quokkify/q4j.git'
                developerConnection = 'scm:git:ssh://git@github.com/quokkify/q4j.git'
            }
        }
    }

    publishing {
        publications.withType(MavenPublication).configureEach {
            versionMapping {
                usage('java-api') {
                    fromResolutionResult()
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }

    def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml')
    def validateMavenCentralPom = tasks.register('validateMavenCentralPom') {
        group = 'verification'
        description = 'Validates that every published dependency has an explicit version.'
        dependsOn tasks.named('generatePomFileForMavenPublication')
        inputs.file(pomFile)

        doLast {
            def pom = new groovy.xml.XmlSlurper().parse(pomFile.get().asFile)
            def missingVersions = pom.dependencies.dependency.findAll {
                it.version.text().trim().isEmpty()
            }.collect {
                "${it.groupId.text()}:${it.artifactId.text()}"
            }

            if (!missingVersions.isEmpty()) {
                throw new GradleException(
                    "${project.path} has published dependencies without versions: ${missingVersions.join(', ')}"
                )
            }
        }
    }

    validateMavenCentralPoms.configure {
        dependsOn validateMavenCentralPom
    }
}
