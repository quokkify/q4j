subprojects {
    tasks.withType(Test).configureEach {
        onlyIf {
            !project.hasProperty("skip.tests") &&
            !project.hasProperty("skipTests") &&
            !Boolean.parseBoolean(System.getProperty("skipTests", "false"))
        }
        useTestNG()
        jvmArgs = ["-ea", "-Xmx512m", "-javaagent:${configurations.agent.singleFile}"]
        systemProperties['file.encoding'] = encoding
        systemProperties['allure.results.directory'] = "${project.layout.buildDirectory.dir("allure-results").get().asFile.absolutePath}"
        systemProperties['allure.report.directory'] = "${project.layout.buildDirectory.dir("allure-report").get().asFile.absolutePath}"

        testLogging {
            events = []
        }

        afterTest { descriptor, result ->
            def status = [
                SUCCESS: 'PASSED',
                FAILURE: 'FAILED',
                SKIPPED: 'SKIPPED'
            ].get(result.resultType.toString())

            if (status != null) {
                def className = descriptor.className ?: descriptor.name
                def simpleClassName = className.substring(className.lastIndexOf('.') + 1)
                def groupName = descriptor
                while (groupName != null && !['Concurrency', 'Sequential'].contains(groupName.name)) {
                    groupName = groupName.parent
                }
                def projectName = project.path.substring(1).replace(':', '@')

                logger.lifecycle(
                    "${projectName} > ${groupName?.name ?: 'Tests'} > ${simpleClassName} > ${descriptor.name} ${status}"
                )
            }
        }
    }
}
