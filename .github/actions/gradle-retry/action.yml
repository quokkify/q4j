name: Gradle command with bounded retry
description: Run a Gradle command, retrying bounded repository 429/403 failures and refreshing dependencies once after a repository not-found failure.

inputs:
  command:
    description: Trusted Gradle command to execute.
    required: true
  max-attempts:
    description: Maximum attempts for transient HTTP 429/403 failures.
    required: false
    default: "3"
  initial-delay-seconds:
    description: Initial delay before a transient HTTP 429/403 retry.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Run Gradle command with bounded recovery
      shell: bash
      env:
        GRADLE_RETRY_COMMAND: ${{ inputs.command }}
        GRADLE_RETRY_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        GRADLE_RETRY_INITIAL_DELAY_SECONDS: ${{ inputs.initial-delay-seconds }}
      run: |
        # shellcheck disable=SC2034
        export GRADLE_RETRY_COMMAND GRADLE_RETRY_MAX_ATTEMPTS GRADLE_RETRY_INITIAL_DELAY_SECONDS
        bash "${GITHUB_ACTION_PATH}/gradle-retry.sh"
