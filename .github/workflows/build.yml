name: "Build modules"
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: push_any
    secrets: inherit

  module-matrices:
    uses: ./.github/workflows/reusable-module-matrices.yml

  build-common:
    name: "Build common • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.common_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@v2.12.3

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 📦 Pack checkstyle reports as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: build-report-common-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports/checkstyle

  build-data:
    name: "Build data • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.data_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@v2.12.3

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 📦 Pack checkstyle reports as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: build-report-data-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports/checkstyle

  build-integrations:
    name: "Build integrations • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.integrations_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@v2.12.3

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew ${{ matrix.module }}:check -x ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 📦 Pack checkstyle reports as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: build-report-integrations-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports/checkstyle
