name: "Test summary"

on:
  workflow_run:
    workflows: ["Run tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.workflow_run.head_repository.full_name || github.repository
    }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  detect-runner:
    name: Setup
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: workflow_run_pr_trusted
      same_repo: ${{ github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name }}
      trusted_author: ${{ contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.workflow_run.actor.association) }}
      is_renovate_bot: ${{ github.event.workflow_run.actor.login == 'renovate[bot]' }}
    secrets: inherit
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' }}

  junit:
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' }}
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - name: 🔨 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🔧 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: 📦 Download source-run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: 🔍 Detect JUnit XML files
        id: junit
        shell: bash
        run: |
          count=$(find artifacts -type f -path "*/build/test-results/*/TEST-*.xml" | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            echo "No JUnit XML files found. Skipping dorny/test-reporter."
          fi

      - name: 🧩 Merge JUnit XML
        if: ${{ steps.junit.outputs.count != '0' }}
        shell: bash
        run: ./tools/scripts/ci/merge_junit_reports.sh artifacts artifacts/_combined/combined-junit.xml

      - name: 🔬 Combined test report
        if: ${{ steps.junit.outputs.count != '0' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: "🔬 Combined test report"
          path: "artifacts/_combined/combined-junit.xml"
          reporter: java-junit
          fail-on-error: "false"

      - name: Mirror Run tests conclusion
        if: always()
        run: |
          case '${{ github.event.workflow_run.conclusion }}' in
            success) exit 0 ;;
            *)
              echo "::error::Run tests ended as ${{ github.event.workflow_run.conclusion }}. JUnit reporting still ran; see the Checks tab and source artifacts."
              exit 1
              ;;
          esac
