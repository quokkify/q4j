name: "Run tests"
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-runner:
    uses: ./.github/workflows/reusable-detect-runner.yml
    with:
      strategy: pr_trusted
      same_repo: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      trusted_author: ${{ contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
      is_renovate_bot: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    secrets: inherit

  module-matrices:
    uses: ./.github/workflows/reusable-module-matrices.yml

  check-formatting:
    name: Lint (Prettier)
    needs: detect-runner
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔧 Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: 🔬Check repository through Prettier
        uses: creyD/prettier_action@8c18391fdc98ed0d884c6345f03975edac71b8f0 # v4.6
        with:
          prettier_options: --check .

  build-common:
    name: "Build common • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, check-formatting]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.common_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  build-data:
    name: "Build data • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.data_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  build-integrations:
    name: "Build integrations • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.integrations_build_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🧱 Build (check, no tests)
        run: |
          ./gradlew \
            ${{ matrix.module }}:check \
            -x ${{ matrix.module }}:test \
            --no-daemon --console=plain --stacktrace
        shell: bash

  test-common:
    name: "Common • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.common_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🚀 Run tests
        run: ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🧾 Allure CI env fragment
        if: always()
        env:
          MODULE_PATH: ${{ matrix.module }}
        run: |
          module_dir="${MODULE_PATH#:}"
          module_dir="${module_dir//:/\/}"
          module_dir="${module_dir:-.}"
          mkdir -p "$module_dir/build/allure-results"
          bash tools/scripts/ci/write-allure-ci-env-fragment.sh "Common ${{ matrix.name }}" "$module_dir/build/allure-results"
        shell: bash

      - name: 📦 Stage dedicated Allure results
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p "allure-artifact/${{ matrix.results_path }}/build"
          cp -a "${{ matrix.results_path }}/build/allure-results" "allure-artifact/${{ matrix.results_path }}/build/"
        shell: bash

      - name: 📊 Upload dedicated Allure results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: allure-results-common-${{ matrix.slug }}
          retention-days: 3
          if-no-files-found: error
          path: "allure-artifact"

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-report-common-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  test-data:
    name: "Data • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-data, test-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.data_test_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🟢 Start Infra with health lifecycle
        if: ${{ matrix.profile != 'none' }}
        uses: quokkify/project-toolkit/actions/compose-up@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0
        with:
          compose-files: |
            tools/environment/docker/docker-compose.yml
            tools/environment/docker/docker-compose.ci.yml
          profiles: ${{ matrix.profile }}
          additional-compose-args: --quiet-pull
          before-compose-hook: tools/environment/scripts/infra/before_compose.sh
          after-health-hook: tools/environment/scripts/infra/after_health.sh
          timeout-seconds: "120"

      - name: 🚀 Run tests
        run: |
          if [[ -f tools/environment/.selenium-grid.env ]]; then
            set -a
            source tools/environment/.selenium-grid.env
            set +a
          fi
          if [[ -f tools/environment/.mock-server.env ]]; then
            set -a
            source tools/environment/.mock-server.env
            set +a
          fi
          if [[ -f tools/environment/.mongo.env ]]; then
            set -a
            source tools/environment/.mongo.env
            set +a
          fi
          if [[ -f tools/environment/.redis.env ]]; then
            set -a
            source tools/environment/.redis.env
            set +a
          fi
          if [[ -f tools/environment/.nginx.env ]]; then
            set -a
            source tools/environment/.nginx.env
            set +a
          fi
          if [[ -f tools/environment/.reportportal.env ]]; then
            set -a
            source tools/environment/.reportportal.env
            set +a
          fi
          if [[ -f tools/environment/.kafka.env ]]; then
            set -a
            source tools/environment/.kafka.env
            set +a
          fi
          if [[ -f tools/environment/.rabbitmq.env ]]; then
            set -a
            source tools/environment/.rabbitmq.env
            set +a
          fi
          if [[ -n "${KAFKA_BOOTSTRAP_SERVERS:-}" ]]; then
            export KAFKA_SERVER_ADDRESS="${KAFKA_BOOTSTRAP_SERVERS}"
          fi
          if [[ "${{ matrix.profile }}" == "web" ]]; then
            if [[ -n "${NGINX_BASE_URL:-}" ]]; then
              export BASE_URL="${NGINX_BASE_URL}"
            else
              echo "NGINX_BASE_URL is not set for web profile" >&2
              exit 1
            fi
          fi

          ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🧾 Allure CI env fragment
        if: always()
        env:
          MODULE_PATH: ${{ matrix.module }}
          QUOKKIFY_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          module_dir="${MODULE_PATH#:}"
          module_dir="${module_dir//:/\/}"
          module_dir="${module_dir:-.}"
          mkdir -p "$module_dir/build/allure-results"
          bash tools/scripts/ci/write-allure-ci-env-fragment.sh "Data ${{ matrix.name }}" "$module_dir/build/allure-results"
        shell: bash

      - name: 📦 Stage dedicated Allure results
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p "allure-artifact/${{ matrix.results_path }}/build"
          cp -a "${{ matrix.results_path }}/build/allure-results" "allure-artifact/${{ matrix.results_path }}/build/"
        shell: bash

      - name: 🛑 Stop Infra
        if: ${{ matrix.profile != 'none' && always() }}
        run: ./tools/environment/scripts/infra/stop_app.sh
        shell: bash

      - name: 📊 Upload dedicated Allure results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: allure-results-data-${{ matrix.slug }}
          retention-days: 3
          if-no-files-found: error
          path: "allure-artifact"

      - name: 📦 Pack docker compose logs as artifact
        if: ${{ matrix.profile != 'none' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-data-${{ matrix.slug }}
          retention-days: 3
          path: logs

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-report-data-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  test-integrations:
    name: "Integrations • ${{ matrix.name }}"
    needs: [detect-runner, module-matrices, build-integrations, test-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ matrix.slug }}
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
      GRID_CDP_ENABLE: "true"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.module-matrices.outputs.integrations_test_modules) }}

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🟢 Start Infra with health lifecycle
        if: ${{ matrix.profile != 'none' }}
        uses: quokkify/project-toolkit/actions/compose-up@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0
        with:
          compose-files: |
            tools/environment/docker/docker-compose.yml
            tools/environment/docker/docker-compose.ci.yml
          profiles: ${{ matrix.profile }}
          additional-compose-args: --quiet-pull
          before-compose-hook: tools/environment/scripts/infra/before_compose.sh
          after-health-hook: tools/environment/scripts/infra/after_health.sh
          timeout-seconds: "120"

      - name: 🚀 Run tests
        run: |
          if [[ -f tools/environment/.selenium-grid.env ]]; then
            set -a
            source tools/environment/.selenium-grid.env
            set +a
          fi
          if [[ -f tools/environment/.mock-server.env ]]; then
            set -a
            source tools/environment/.mock-server.env
            set +a
          fi
          if [[ -f tools/environment/.mongo.env ]]; then
            set -a
            source tools/environment/.mongo.env
            set +a
          fi
          if [[ -f tools/environment/.redis.env ]]; then
            set -a
            source tools/environment/.redis.env
            set +a
          fi
          if [[ -f tools/environment/.nginx.env ]]; then
            set -a
            source tools/environment/.nginx.env
            set +a
          fi
          if [[ -f tools/environment/.reportportal.env ]]; then
            set -a
            source tools/environment/.reportportal.env
            set +a
          fi
          if [[ -f tools/environment/.kafka.env ]]; then
            set -a
            source tools/environment/.kafka.env
            set +a
          fi
          if [[ -f tools/environment/.rabbitmq.env ]]; then
            set -a
            source tools/environment/.rabbitmq.env
            set +a
          fi
          if [[ -n "${KAFKA_BOOTSTRAP_SERVERS:-}" ]]; then
            export KAFKA_SERVER_ADDRESS="${KAFKA_BOOTSTRAP_SERVERS}"
          fi
          if [[ "${{ matrix.profile }}" == "web" ]]; then
            if [[ -n "${NGINX_BASE_URL:-}" ]]; then
              export BASE_URL="${NGINX_BASE_URL}"
            else
              echo "NGINX_BASE_URL is not set for web profile" >&2
              exit 1
            fi
          fi

          ./gradlew ${{ matrix.module }}:test --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🧾 Allure CI env fragment
        if: always()
        env:
          MODULE_PATH: ${{ matrix.module }}
          QUOKKIFY_TEST_PROFILE: ${{ matrix.profile }}
        run: |
          module_dir="${MODULE_PATH#:}"
          module_dir="${module_dir//:/\/}"
          module_dir="${module_dir:-.}"
          mkdir -p "$module_dir/build/allure-results"
          bash tools/scripts/ci/write-allure-ci-env-fragment.sh "Integrations ${{ matrix.name }}" "$module_dir/build/allure-results"
        shell: bash

      - name: 📦 Stage dedicated Allure results
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p "allure-artifact/${{ matrix.results_path }}/build"
          cp -a "${{ matrix.results_path }}/build/allure-results" "allure-artifact/${{ matrix.results_path }}/build/"
        shell: bash

      - name: 🛑 Stop Infra
        if: ${{ matrix.profile != 'none' && always() }}
        run: ./tools/environment/scripts/infra/stop_app.sh
        shell: bash

      - name: 📊 Upload dedicated Allure results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: allure-results-integrations-${{ matrix.slug }}
          retention-days: 3
          if-no-files-found: error
          path: "allure-artifact"

      - name: 📦 Pack docker compose logs as artifact
        if: ${{ matrix.profile != 'none' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-integrations-${{ matrix.slug }}
          retention-days: 3
          path: logs

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-report-integrations-${{ matrix.slug }}
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  stability-tests:
    name: Stability tests
    needs: [detect-runner, build-integrations, test-common]
    runs-on: ${{ fromJson(needs.detect-runner.outputs.runs_on) }}
    if: ${{ github.event_name != 'pull_request_target' }}
    permissions:
      contents: read
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-stability-tests
      EXECUTION_MODE: ${{ needs.detect-runner.outputs.is_self_hosted == 'true' && 'DIND' || 'CI' }}
      GRID_CDP_ENABLE: "true"
      SUITE_NAME: integration@selenide > stability-tests

    steps:
      - name: 🔨Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔨Prepare Java/Gradle
        uses: quokkify/project-toolkit/actions/setup-java-gradle@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0

      - name: 🟢 Start Infra with health lifecycle
        uses: quokkify/project-toolkit/actions/compose-up@aa4efad58b185a16ea6761960a9e125a7db25604 # v2.14.0
        with:
          compose-files: |
            tools/environment/docker/docker-compose.yml
            tools/environment/docker/docker-compose.ci.yml
          profiles: web
          additional-compose-args: --quiet-pull
          before-compose-hook: tools/environment/scripts/infra/before_compose.sh
          after-health-hook: tools/environment/scripts/infra/after_health.sh
          timeout-seconds: "120"

      - name: 🚀 Run table model stability tests
        run: |
          if [[ -f tools/environment/.selenium-grid.env ]]; then
            set -a
            source tools/environment/.selenium-grid.env
            set +a
          fi
          set -a
          source tools/environment/.nginx.env
          set +a
          if [[ -n "${NGINX_BASE_URL:-}" ]]; then
            export BASE_URL="${NGINX_BASE_URL}"
          else
            echo "NGINX_BASE_URL is not set for web profile" >&2
            exit 1
          fi

          ./gradlew :integrations:selenide:tableModelContractStability --no-daemon --console=plain --stacktrace
        shell: bash

      - name: 🧾 Allure CI env fragment
        if: always()
        env:
          MODULE_PATH: ":integrations:selenide"
          QUOKKIFY_TEST_PROFILE: web
        run: |
          mkdir -p integrations/selenide/build/allure-results
          bash tools/scripts/ci/write-allure-ci-env-fragment.sh "integration@selenide > stability-tests" integrations/selenide/build/allure-results
        shell: bash

      - name: 📦 Stage dedicated Allure results
        if: always()
        run: |
          rm -rf allure-artifact
          mkdir -p allure-artifact/integrations/selenide/build
          cp -a integrations/selenide/build/allure-results allure-artifact/integrations/selenide/build/
        shell: bash

      - name: 🛑 Stop Infra
        if: always()
        run: ./tools/environment/scripts/infra/stop_app.sh
        shell: bash

      - name: 📊 Upload dedicated Allure results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: allure-results-stability-tests
          retention-days: 3
          if-no-files-found: error
          path: "allure-artifact"

      - name: 📦 Pack docker compose logs as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-stability-tests
          retention-days: 3
          path: logs

      - name: 📦 Pack test results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-report-stability-tests
          retention-days: 3
          path: |
            **/build/reports
            **/build/test-results

  tests-complete:
    name: Tests pipeline complete
    needs: [test-data, test-integrations, stability-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate stage results
        shell: bash
        run: |
          if [[ "${{ needs.test-data.result }}" != "success" || "${{ needs.test-integrations.result }}" != "success" || "${{ needs.stability-tests.result }}" != "success" ]]; then
            echo "Test stages are not successful."
            exit 1
          fi
          echo "All test stages completed successfully."
