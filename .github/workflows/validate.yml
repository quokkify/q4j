name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-contract:
    name: Shared template contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate generated configuration
        run: |
          python -m pip install PyYAML==6.0.3
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml

          answers = yaml.safe_load(Path(".copier-answers.yml").read_text())
          required_answers = ("_src_path", "_commit", "toolkit_version")
          if not isinstance(answers, dict) or any(not answers.get(key) for key in required_answers):
              raise SystemExit(".copier-answers.yml must contain _src_path, _commit, and toolkit_version")
          if answers["_commit"] != answers["toolkit_version"]:
              raise SystemExit("Copier _commit must match toolkit_version")
          renovate_path = Path(".github/renovate.json")
          if answers.get("renovate") and not renovate_path.is_file():
              raise SystemExit("renovate=true requires .github/renovate.json")
          allure_paths = (
              Path(".github/workflows/allure-report.yml"),
              Path("tools/allure/allurerc.mjs"),
              Path("tools/allure/safe_extract.py"),
          )
          if answers.get("allure_report") and any(not path.is_file() for path in allure_paths):
              raise SystemExit("allure_report=true requires its generated workflow, config, and bounded extractor")
          if answers.get("allure_report"):
              import os
              import subprocess
              import tempfile

              allure_path = Path(".github/workflows/allure-report.yml")
              allure_workflow = allure_path.read_text()
              allure_document = yaml.safe_load(allure_workflow)
              resolve_script = next(
                  step["with"]["script"]
                  for step in allure_document["jobs"]["resolve"]["steps"]
                  if step.get("id") == "resolve"
              )
              generate_steps = allure_document["jobs"]["generate"]["steps"]
              report_action = next(
                  step for step in generate_steps
                  if str(step.get("uses", "")).startswith("quokkify/project-toolkit/actions/allure-report@")
              )
              pages_action = next(
                  step for step in allure_document["jobs"]["pages"]["steps"]
                  if str(step.get("uses", "")).startswith("quokkify/project-toolkit/actions/deploy-gh-pages-subdir@")
              )
              pr_expression = "${" + "{ needs.resolve.outputs.pr-number }}"
              report_pages_url = str(report_action["with"].get("pages-url", ""))
              if pr_expression not in report_pages_url or \
                      not report_pages_url.endswith("/allure-report/") or \
                      pr_expression not in str(pages_action["with"].get("destination-dir", "")):
                  raise SystemExit("Allure Pages URL must use the resolved PR number and generated allure-report subdirectory")
              test_workflow = Path(".github/workflows/test.yml").read_text()
              if 'path: "**/build/allure-results"' in test_workflow:
                  raise SystemExit("Test jobs must upload only their own Allure results directory")
              if "allure-artifact" not in test_workflow:
                  raise SystemExit("Test jobs must stage Allure results with their module path preserved")
              if "allure-artifact/stability-tests/build" not in test_workflow:
                  raise SystemExit("Stability Allure results must use a distinct source path")
              if "results_path" not in test_workflow or "results_path" not in Path(".github/workflows/reusable-module-matrices.yml").read_text():
                  raise SystemExit("Test matrix must provide a dedicated Allure results path")

              node_harness = r'''
                (async () => {
                const fs = require("fs");
                const script = fs.readFileSync(process.argv[2], "utf8");
                const input = JSON.parse(fs.readFileSync(0, "utf8"));
                const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
                const outputs = {};
                const warnings = [];
                let failure = null;
                const run = { path: ".github/workflows/test.yml", head_sha: "sha", id: 42,
                  workflow_id: 7, head_repository: { full_name: "quokkify/q4j" } };
                const context = { payload: { workflow_run: run }, repo: { owner: "quokkify", repo: "q4j" } };
                const pulls = [{ number: 566, base: { repo: { full_name: "quokkify/q4j" } },
                  head: { repo: { full_name: "quokkify/q4j" }, sha: "sha" }, user: { login: "owner" } }];
                const artifacts = Array.from({ length: input.count }, (_, index) => ({
                  name: "allure-results-" + String(index).padStart(2, "0"), id: index + 1,
                  expired: Boolean(input.expired && index === 0), size_in_bytes: 0,
                }));
                if (input.duplicate) artifacts[input.count - 1].name = artifacts[0].name;
                if (input.bytes) artifacts[0].size_in_bytes = input.bytes;
                const github = { rest: { pulls: { list: {} }, actions: {
                  listWorkflowRuns: {}, listWorkflowRunArtifacts: {} } },
                  paginate: async (method) => method === github.rest.pulls.list ? pulls :
                    method === github.rest.actions.listWorkflowRuns ? [run] : artifacts };
                const core = { warning: (message) => warnings.push(message),
                  setFailed: (message) => { failure = message; },
                  setOutput: (key, value) => { outputs[key] = value; } };
                try { await new AsyncFunction("context", "github", "core", script)(context, github, core); }
                catch (error) { failure = "uncaught: " + error.message; }
                process.stdout.write(JSON.stringify({ outputs, warnings, failure }));
                })();
              '''

              def execute(script, count, *, duplicate=False, expired=False, bytes_=0):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as script_handle, \
                          tempfile.NamedTemporaryFile("w", suffix=".js", delete=False) as harness_handle:
                      script_handle.write(script)
                      harness_handle.write(node_harness)
                      script_path = script_handle.name
                      harness_path = harness_handle.name
                  try:
                      result = subprocess.run(
                          ["node", harness_path, script_path],
                          input=json.dumps({"count": count, "duplicate": duplicate, "expired": expired, "bytes": bytes_}),
                          text=True, capture_output=True, check=False,
                      )
                  finally:
                      os.unlink(script_path)
                      os.unlink(harness_path)
                  if result.returncode != 0:
                      raise SystemExit(f"Allure resolver harness failed: {result.stderr}")
                  return json.loads(result.stdout)

              # Execute the real resolver against boundary and invalid contracts.
              limit = 262144000
              cases = (
                  ("zero", 0, {}, lambda result: result["outputs"].get("ready") == "false" and result["warnings"] and not result["failure"]),
                  ("one", 1, {}, lambda result: bool(result["failure"])),
                  ("twenty-three", 23, {}, lambda result: bool(result["failure"])),
                  ("twenty-four", 24, {}, lambda result: result["outputs"].get("ready") == "true" and len(json.loads(result["outputs"]["artifact_manifest"])) == 24),
                  ("fifty", 50, {}, lambda result: result["outputs"].get("ready") == "true"),
                  ("fifty-one", 51, {}, lambda result: bool(result["failure"])),
                  ("duplicate", 24, {"duplicate": True}, lambda result: bool(result["failure"])),
                  ("expired", 24, {"expired": True}, lambda result: bool(result["failure"])),
                  ("exact-limit", 24, {"bytes_": limit}, lambda result: result["outputs"].get("ready") == "true"),
                  ("over-limit", 24, {"bytes_": limit + 1}, lambda result: bool(result["failure"])),
              )
              for name, count, options, assertion in cases:
                  if not assertion(execute(resolve_script, count, **options)):
                      raise SystemExit(f"Executable Allure resolver contract failed: {name}")

              # Disposable mutations must be rejected by the executable contract.
              mutations = (
                  ("length===7", resolve_script.replace("actualNames.length < minimumArtifacts", "actualNames.length === 7"), 24, {}, lambda result: bool(result["failure"])),
                  ("<1", resolve_script.replace("actualNames.length < minimumArtifacts", "actualNames.length < 1"), 1, {}, lambda result: bool(result["failure"])),
                  ("zero false-and", resolve_script.replace("if (actualNames.length === 0)", "if (false && actualNames.length === 0)"), 0, {}, lambda result: result["outputs"].get("ready") == "false" and result["warnings"]),
                  ("partial false-and", resolve_script.replace("actualNames.length < minimumArtifacts ||", "actualNames.length < minimumArtifacts && false ||"), 1, {}, lambda result: bool(result["failure"])),
              )
              for name, mutated_script, count, options, assertion in mutations:
                  if mutated_script == resolve_script or assertion(execute(mutated_script, count, **options)):
                      raise SystemExit(f"Executable Allure mutation was accepted: {name}")
              bad_expression = "${" + "{ needs.resolve.outputs.pr-bogus }}"
              mutated_workflow = allure_workflow.replace(pr_expression, bad_expression, 1)
              mutated_document = yaml.safe_load(mutated_workflow)
              mutated_report = next(step for step in mutated_document["jobs"]["generate"]["steps"] if str(step.get("uses", "")).startswith("quokkify/project-toolkit/actions/allure-report@"))
              mutated_pages = next(step for step in mutated_document["jobs"]["pages"]["steps"] if str(step.get("uses", "")).startswith("quokkify/project-toolkit/actions/deploy-gh-pages-subdir@"))
              if pr_expression in str(mutated_report["with"].get("pages-url", "")) and pr_expression in str(mutated_pages["with"].get("destination-dir", "")):
                  raise SystemExit("Executable Allure mutation was accepted: pr-bogus")
          components = answers.get("components")
          if answers.get("allure_report") and not components:
              source_path = Path(str(answers.get("allure_external_workflow_path", "")))
              if not source_path.is_file():
                  raise SystemExit("external Allure reporting requires its configured source workflow")
              minimum = answers.get("allure_external_artifact_min_count")
              maximum = answers.get("allure_external_artifact_max_count")
              if not isinstance(minimum, int) or not isinstance(maximum, int) or not 1 <= minimum <= maximum <= 50:
                  raise SystemExit("external Allure artifact counts must satisfy 1 <= minimum <= maximum <= 50")
          categories_file = answers.get("allure_categories_file")
          if categories_file and not Path(str(categories_file)).is_file():
              raise SystemExit("configured Allure categories file does not exist")
          if answers.get("allure_publish_pages") and not answers.get("allure_report"):
              raise SystemExit("allure_publish_pages=true requires allure_report=true")
          for path in (renovate_path, Path(".github/release-please/config.json"), Path(".github/release-please/manifest.json")):
              if path.exists():
                  json.loads(path.read_text())
          for path in Path(".github/workflows").glob("*.yml"):
              text = path.read_text()
              yaml.safe_load(text)
              for line in text.splitlines():
                  marker = "uses: quokkify/project-toolkit/"
                  if line.lstrip().startswith(marker):
                      reference = line.split("@", 1)[1].split()[0]
                      comment = line.partition("#")[2].strip()
                      pinned_release = len(reference) == 40 and all(char in "0123456789abcdef" for char in reference) and comment == answers["toolkit_version"]
                      if reference != answers["toolkit_version"] and not pinned_release:
                          raise SystemExit(f"{path} uses toolkit {reference}, expected {answers['toolkit_version']}")

          publish_workflow = Path(".github/workflows/publish-maven-central.yml")
          if publish_workflow.is_file():
              publish_text = publish_workflow.read_text()
              if "uses: actions/setup-java@" in publish_text:
                  raise SystemExit("Maven Central publishing must use project-toolkit/actions/setup-java-gradle")
              setup_java_gradle = re.search(
                  r"(?m)^\s+uses: quokkify/project-toolkit/actions/setup-java-gradle@(?P<reference>[^ #]+)(?:\s+#\s*(?P<comment>\S+))?$",
                  publish_text,
              )
              if not setup_java_gradle:
                  raise SystemExit("Maven Central publishing must use project-toolkit/actions/setup-java-gradle")
              reference = setup_java_gradle.group("reference")
              comment = setup_java_gradle.group("comment")
              pinned_release = len(reference) == 40 and all(char in "0123456789abcdef" for char in reference)
              if (reference != answers["toolkit_version"] and not pinned_release) or (pinned_release and comment != answers["toolkit_version"]):
                  raise SystemExit("Maven Central publishing toolkit action must match toolkit_version")

          selenium_grid = Path("tools/environment/assets/selenium-grid/config.toml").read_text()
          marker = re.search(
              r'(?m)^# renovate: depName=selenium/standalone-chromium currentValue=(?P<currentValue>\d+\.\d+(?:\.\d+)?-\d+) currentDigest=(?P<currentDigest>sha256:[a-f0-9]{64})$',
              selenium_grid,
          )
          if not marker:
              raise SystemExit("selenium grid config must keep a valid Renovate marker comment for the standalone-chromium image")
          configs_line = re.search(
              r'(?m)^configs = \["selenium/standalone-chromium:(?P<currentValue>\d+\.\d+(?:\.\d+)?-\d+)"',
              selenium_grid,
          )
          if not configs_line or configs_line.group("currentValue") != marker.group("currentValue"):
              raise SystemExit("selenium grid config must pin the standalone-chromium image by tag and keep marker/config values aligned")
          if '@sha256:' in selenium_grid:
              raise SystemExit("selenium grid config must not use a digest reference in configs")
          renovate = json.loads(Path(".github/renovate.json").read_text())
          selenium_rules = [
              rule for rule in renovate["customManagers"]
              if "Selenium" in str(rule.get("description", ""))
          ]
          if len(selenium_rules) != 1:
              raise SystemExit("selenium Renovate extraction must stay consolidated into a single custom manager")
          selenium_rule = selenium_rules[0]
          pattern = selenium_rule["matchStrings"][0]
          if "depName=(?<depName>selenium/standalone-chromium)" not in pattern or "currentDigest=(?<currentDigest>sha256:[a-f0-9]{64})" not in pattern or "configs\\s*=\\s*\\[\\s*\"selenium/standalone-chromium:(?<currentValue>" not in pattern:
              raise SystemExit("selenium Renovate matcher must capture both the digest marker and config tag in one rule")
          if selenium_rule.get("datasourceTemplate") != "docker":
              raise SystemExit("selenium Renovate matcher must stay on the docker datasource")
          if selenium_rule.get("packageNameTemplate") != "selenium/standalone-chromium":
              raise SystemExit("selenium Renovate matcher must explicitly pin the standalone-chromium package name")
          if selenium_rule.get("versioningTemplate") != "regex:^(?<major>\\d+)\\.(?<minor>\\d+)(?:\\.(?<patch>\\d+))?-(?<build>\\d+)$":
              raise SystemExit("selenium Renovate matcher must keep the dated tag versioning")
          PY
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo actionlint_checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 actionlint "$RUNNER_TEMP/bin/actionlint"
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/*.yml
      - name: Check committed diff whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi
