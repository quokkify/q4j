name: Verify toolkit reusable Java CI
on:
  push:
    branches: [verify/toolkit-18c54f1]
  workflow_dispatch:
jobs:
  toolkit:
    uses: quokkify/project-toolkit/.github/workflows/java-ci.yml@28c0d0049a3b0d4c12cd63e922e19e728b90ff93
    with:
      working-directory: .
      java-version: "21"
      build-tool: gradle
      lint-command: bash ./gradlew classes --no-daemon
      test-command: bash ./gradlew test --no-daemon -x :integrations:kafka:test
      build-command: bash ./gradlew assemble --no-daemon
