<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dropdown recipes fixture</title>
    <style>
      body {
        font-family: sans-serif;
      }
      .fixture-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      .fixture-card {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 12px;
      }
      .widget {
        margin-top: 8px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 24px;
        margin-top: 8px;
      }
      .item {
        align-items: center;
        background: #eff6ff;
        border: 1px solid #93c5fd;
        border-radius: 999px;
        display: inline-flex;
        gap: 6px;
        padding: 2px 8px;
      }
      .item[hidden] {
        display: none;
      }
      .item .item-label {
        font-size: 14px;
      }
      .item button {
        background: transparent;
        border: 0;
        color: #b91c1c;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        padding: 0;
      }
      [role="listbox"] {
        border: 1px solid #94a3b8;
        border-radius: 6px;
        margin-top: 8px;
        max-height: 180px;
        overflow: auto;
        padding: 4px;
      }
      [role="listbox"][hidden] {
        display: none;
      }
      [role="option"] {
        border-radius: 4px;
        cursor: pointer;
        padding: 6px 8px;
      }
      [role="option"]:hover {
        background: #dbeafe;
      }
    </style>
  </head>
  <body>
    <div class="fixture-grid">
      <section class="fixture-card">
        <h2>Single select</h2>
        <div id="single-closed" class="widget"></div>
        <div id="single-portal" class="widget"></div>
      </section>
      <section class="fixture-card">
        <h2>Multi select (chips)</h2>
        <div id="multi-primary" class="widget"></div>
      </section>
    </div>

    <script>
      (function () {
        function renderShell(root, config, withListbox) {
          root.innerHTML = `
            <label>${config.label}
              <input type="text"
                     role="combobox"
                     aria-expanded="false"
                     placeholder="Search ${config.label.toLowerCase()}" />
            </label>
            <div class="chip-row" data-chips></div>
            ${withListbox ? `<div id="${config.id}-listbox" role="listbox" hidden></div>` : ""}
          `;
          return {
            input: root.querySelector("input"),
            chips: root.querySelector("[data-chips]"),
            listbox: root.querySelector('[role="listbox"]'),
          };
        }

        function renderOptions(listbox, options, query, onPick) {
          listbox.innerHTML = "";
          options
            .filter((option) =>
              option.toLowerCase().includes(query.toLowerCase()),
            )
            .forEach((option) => {
              const el = document.createElement("div");
              el.setAttribute("role", "option");
              el.textContent = option;
              el.addEventListener("click", () => onPick(option));
              listbox.appendChild(el);
            });
        }

        function bindOpenClose(input, open, close) {
          input.addEventListener("click", open);
          input.addEventListener("input", open);
          input.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              close();
            }
          });
        }

        function createSelectedValue(chips) {
          chips.innerHTML =
            '<div class="item" hidden><span class="item-label"></span></div>';
          const selected = chips.querySelector(".item");
          return (text) => {
            selected.querySelector(".item-label").textContent = text;
            selected.hidden = false;
          };
        }

        function createSingleDropdown(root, config) {
          const { input, chips, listbox } = renderShell(root, config, true);
          input.setAttribute("aria-controls", listbox.id);
          const showSelected = createSelectedValue(chips);

          function close() {
            listbox.hidden = true;
            input.setAttribute("aria-expanded", "false");
          }

          function open() {
            renderOptions(listbox, config.options, input.value, (text) => {
              showSelected(text);
              close();
            });
            listbox.hidden = false;
            input.setAttribute("aria-expanded", "true");
          }

          bindOpenClose(input, open, close);
        }

        function createPortalDropdown(root, config) {
          const listboxId = `${config.id}-listbox`;
          const { input, chips } = renderShell(root, config, false);
          const showSelected = createSelectedValue(chips);
          let renderTimer = 0;

          function close() {
            window.clearTimeout(renderTimer);
            const listbox = document.getElementById(listboxId);
            if (listbox) {
              listbox.remove();
            }
            input.removeAttribute("aria-controls");
            input.setAttribute("aria-expanded", "false");
          }

          function render() {
            let listbox = document.getElementById(listboxId);
            if (!listbox) {
              listbox = document.createElement("div");
              listbox.id = listboxId;
              listbox.setAttribute("role", "listbox");
              document.body.appendChild(listbox);
            }
            renderOptions(listbox, config.options, input.value, (text) => {
              showSelected(text);
              close();
            });
            input.setAttribute("aria-controls", listboxId);
            input.setAttribute("aria-expanded", "true");
          }

          function open() {
            window.clearTimeout(renderTimer);
            renderTimer = window.setTimeout(render, config.renderDelayMs);
          }

          bindOpenClose(input, open, close);
        }

        function createMultiDropdown(root, config) {
          const { input, chips, listbox } = renderShell(root, config, true);
          input.setAttribute("aria-controls", listbox.id);
          const state = config.selected.slice();

          function removeLater(label) {
            window.setTimeout(() => {
              const index = state.indexOf(label);
              if (index >= 0) {
                state.splice(index, 1);
                renderChips();
              }
            }, config.removalDelayMs);
          }

          function renderChips() {
            chips.innerHTML = "";
            state.forEach((label) => {
              const chip = document.createElement("div");
              chip.className = "item";
              const text = document.createElement("span");
              text.className = "item-label";
              text.textContent = label;
              const remove = document.createElement("button");
              remove.type = "button";
              remove.textContent = `REMOVE ${label.toUpperCase()}`;
              remove.addEventListener("click", () => removeLater(label));
              chip.append(text, remove);
              chips.appendChild(chip);
            });
          }

          function close() {
            listbox.hidden = true;
            input.setAttribute("aria-expanded", "false");
          }

          function open() {
            renderOptions(listbox, config.options, input.value, (text) => {
              state.push(text);
              renderChips();
              close();
            });
            listbox.hidden = false;
            input.setAttribute("aria-expanded", "true");
          }

          bindOpenClose(input, open, close);
          renderChips();
        }

        createSingleDropdown(document.getElementById("single-closed"), {
          id: "single-closed",
          label: "Closed single",
          options: ["Blueberry", "Blackberry", "Cranberry"],
        });

        createPortalDropdown(document.getElementById("single-portal"), {
          id: "single-portal",
          label: "Portal single",
          renderDelayMs: 300,
          options: ["Peach", "Pear", "Plum"],
        });

        createMultiDropdown(document.getElementById("multi-primary"), {
          id: "multi-primary",
          label: "Primary multi",
          removalDelayMs: 250,
          selected: ["Alpha", "Beta"],
          options: ["Gamma", "Delta"],
        });
      })();
    </script>
  </body>
</html>
