description = "Wrapper around Selenide for user interface testing"

import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

abstract class SelenideBrowserTestLock implements BuildService<BuildServiceParameters.None> {}

def selenideBrowserTestLock = gradle.sharedServices.registerIfAbsent("selenideBrowserTestLock", SelenideBrowserTestLock) {
    maxParallelUsages = 1
}

dependencies {
    implementation project(":common-utils:config")
    implementation project(":common-utils:core")
    implementation project(":common-utils:html")
    implementation project(":common-utils:awaitility")
    compileOnly project(":testng-extensions")

    implementation libs.selenide
    testImplementation project(":testng-extensions")
    testImplementation project(":integrations:selenide-proxy")
    testImplementation libs.allure.selenide
    testImplementation libs.allure.testng
    testImplementation libs.mockito.core

    api "org.assertj:assertj-core"
}

tasks.named("test", Test) {
    usesService(selenideBrowserTestLock)
}

tasks.register("tableModelContractStability", Test) {
    description = "Runs the two timing-sensitive table model scenarios 20 times each"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    usesService(selenideBrowserTestLock)
    maxParallelForks = 1
    systemProperty("tableModel.contract.repetitions", "20")
    filter {
        includeTestsMatching("dev.quokkify.test.TableModelContractTest.waitsForDelayedRow")
        includeTestsMatching("dev.quokkify.test.TableModelContractTest.rowReferenceSurvivesRemount")
    }
}
