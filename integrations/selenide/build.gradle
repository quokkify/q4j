description = "Wrapper around Selenide for user interface testing"

dependencies {
    implementation project(":common-utils:config")
    implementation project(":common-utils:core")
    implementation project(":common-utils:html")
    implementation project(":common-utils:awaitility")
    compileOnly project(":testng-extensions")

    implementation "com.codeborne:selenide:${selenide}"
    testImplementation project(":testng-extensions")
    testImplementation project(":integrations:selenide-proxy")
    testImplementation "io.qameta.allure:allure-selenide:${allure}"
    testImplementation "io.qameta.allure:allure-testng:${allure}"
    testImplementation "org.mockito:mockito-core"

    api "org.assertj:assertj-core"
}

tasks.register("tableModelContractStability", Test) {
    description = "Runs the two timing-sensitive table model scenarios 50 times each"
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG()
    filter {
        includeTestsMatching("dev.quokkify.test.TableModelContractStabilityTest.*")
    }
}
