<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Customer page object UX fixture</title>
  </head>
  <body>
    <table id="profile">
      <tr><th>Customer</th><td>Ernst Handel</td></tr>
      <tr><th>Country</th><td>Austria</td></tr>
    </table>

    <section id="customer-orders">
      <h2>Orders of Ernst Handel</h2>
      <table class="history">
        <thead>
          <tr><th>ID</th><th>Customer</th><th>Status</th><th>Qty</th><th>Paid</th><th>Note</th><th>Action</th></tr>
        </thead>
        <tbody>
          <tr><td>A-2</td><td>Ernst Handel</td><td>New</td><td>12</td><td><input type="checkbox" checked /></td><td><input class="note" value="" /></td><td><button type="button">Ship</button></td></tr>
          <tr><td>Z-9</td><td>Ernst Handel</td><td>Delivered</td><td>1</td><td><input type="checkbox" checked /></td><td><input class="note" value="" /></td><td><button type="button" disabled>Ship</button></td></tr>
        </tbody>
      </table>
    </section>
  </body>
</html>
