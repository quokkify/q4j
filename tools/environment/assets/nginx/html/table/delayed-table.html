<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Delayed table</title>
  </head>
  <body>
    <table id="customers">
      <thead>
        <tr>
          <th>Company</th>
          <th>Contact</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alfreds Futterkiste</td>
          <td>Maria Anders</td>
          <td>Germany</td>
        </tr>
      </tbody>
    </table>

    <div id="flex-customers">
      <div class="flex-table-row">
        <div>Company</div>
        <div>Contact</div>
        <div>Country</div>
      </div>
      <div class="flex-table-row">
        <div>Alfreds Futterkiste</div>
        <div>Maria Anders</div>
        <div>Germany</div>
      </div>
    </div>

    <table id="horizontal-customers">
      <!-- DynamicHorizontalHeader intentionally uses a different enum order. -->
      <tr>
        <th>Name</th>
        <td>Bill Gates</td>
      </tr>
      <tr>
        <th>Telephone 1</th>
        <td>555 77 854</td>
      </tr>
    </table>

    <script>
      window.reloadClassicTable = function () {
        const currentTable = document.getElementById("customers");
        const reloadedTable = currentTable.cloneNode(true);
        const countryCell = Array.from(
          reloadedTable.querySelectorAll("tbody tr"),
        ).find((row) => row.cells[0].textContent === "Ernst Handel").cells[2];
        countryCell.textContent = "Austria reloaded";
        const placeholder = document.createComment("classic table reload");
        currentTable.replaceWith(placeholder);
        setTimeout(() => placeholder.replaceWith(reloadedTable), 250);
      };

      window.reloadFlexTable = function () {
        const currentTable = document.getElementById("flex-customers");
        const reloadedTable = currentTable.cloneNode(true);
        const row = Array.from(
          reloadedTable.querySelectorAll(".flex-table-row"),
        ).find(
          (candidate) => candidate.children[0].textContent === "Ernst Handel",
        );
        row.children[2].textContent = "Austria reloaded";
        const placeholder = document.createComment("flex table reload");
        currentTable.replaceWith(placeholder);
        setTimeout(() => placeholder.replaceWith(reloadedTable), 250);
      };

      window.reloadHorizontalTable = function () {
        const currentTable = document.getElementById("horizontal-customers");
        const reloadedTable = currentTable.cloneNode(true);
        const row = Array.from(reloadedTable.querySelectorAll("tr")).find(
          (candidate) =>
            candidate.querySelector("th").textContent === "Telephone 2",
        );
        row.querySelector("td").textContent = "555 77 856";
        const placeholder = document.createComment("horizontal table reload");
        currentTable.replaceWith(placeholder);
        setTimeout(() => placeholder.replaceWith(reloadedTable), 250);
      };

      setTimeout(function () {
        document
          .querySelector("#customers tbody")
          .insertAdjacentHTML(
            "beforeend",
            "<tr><td>Ernst Handel</td><td>Roland Mendel</td><td>Austria</td></tr>",
          );
        document
          .getElementById("flex-customers")
          .insertAdjacentHTML(
            "beforeend",
            '<div class="flex-table-row"><div>Ernst Handel</div><div>Roland Mendel</div><div>Austria</div></div>',
          );
        document
          .querySelector("#horizontal-customers tbody")
          .insertAdjacentHTML(
            "beforeend",
            "<tr><th>Telephone 2</th><td>555 77 855</td></tr>",
          );
      }, 1500);
    </script>
  </body>
</html>
