services:
  dind:
    image: docker:29.7-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    volumes:
      - dind-data:/var/lib/docker

  runner:
    image: myoung34/github-runner:2.337.0@sha256:03daab12e729883bdb1f58c2b6962a4f394c6b43d3d6bffd272aeae335f26a32
    depends_on:
      - dind
    environment:
      REPO_URL: ${REPO_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      LABELS: ${RUNNER_LABELS}
      RUNNER_EPHEMERAL: "true"
      DISABLE_AUTO_UPDATE: "true"
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_CERTDIR: ""
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    volumes:
      - runner-toolcache:/opt/hostedtoolcache
      - runner-gradle-cache:/home/runner/.gradle

volumes:
  dind-data:
  runner-toolcache:
  runner-gradle-cache:
