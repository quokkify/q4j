services:
  dind:
    image: docker:29.8-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    volumes:
      - dind-data:/var/lib/docker

  runner:
    image: myoung34/github-runner:2.338.0@sha256:a97aa55628225bc94af2e78c40f6877a000430255af6bf0aed119a7b0b85ee8c
    depends_on:
      - dind
    environment:
      REPO_URL: ${REPO_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      LABELS: ${RUNNER_LABELS}
      RUNNER_EPHEMERAL: "true"
      DISABLE_AUTO_UPDATE: "true"
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_CERTDIR: ""
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    volumes:
      - runner-toolcache:/opt/hostedtoolcache
      - runner-gradle-cache:/home/runner/.gradle

volumes:
  dind-data:
  runner-toolcache:
  runner-gradle-cache:
