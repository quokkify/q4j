dependencies {
    implementation project(":common-utils:core")
    implementation project(":common-utils:file")
    implementation project(":common-utils:awaitility")
    implementation project(":common-utils:config")
    implementation project(":testng-extensions")

    implementation libs.classgraph
    implementation libs.hibernate.core
    implementation libs.hibernate.agroal
    implementation libs.jakarta.persistence.api
    implementation libs.hibernate.type
    api libs.querydsl.jpa
    implementation libs.jakarta.annotation.api
    annotationProcessor variantOf(libs.querydsl.apt) { classifier("jpa") }
    annotationProcessor libs.jakarta.persistence.api
    annotationProcessor libs.jakarta.annotation.api
    testAnnotationProcessor variantOf(libs.querydsl.apt) { classifier("jpa") }
    testAnnotationProcessor libs.jakarta.persistence.api
    testAnnotationProcessor libs.jakarta.annotation.api
    api libs.assertj.core
    testRuntimeOnly libs.h2
    testRuntimeOnly libs.postgresql
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Aquerydsl.entityAccessors=true",
            "-Aquerydsl.useFields=false",
            "-Aquerydsl.generatedAnnotationClass=jakarta.annotation.Generated",
            "-processor", "com.querydsl.apt.jpa.JPAAnnotationProcessor"
    ]
    options.encoding = "UTF-8"
}

tasks.named("sourcesJar").configure {
    dependsOn(tasks.named("compileJava"))
}

sourceSets {
    main { java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main" }
    test { java.srcDir "$buildDir/generated/sources/annotationProcessor/java/test" }
}
