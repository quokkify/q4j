dependencies {
    implementation project(":common-utils:core")
    implementation project(":common-utils:file")
    implementation project(":common-utils:awaitility")
    implementation project(":common-utils:config")
    implementation project(":testng-extensions")

    implementation "io.github.classgraph:classgraph:${classgraph}"
    implementation "org.hibernate.orm:hibernate-core:${hibernate}"
    implementation "org.hibernate.orm:hibernate-c3p0:${hibernate}"
    implementation "jakarta.persistence:jakarta.persistence-api:${jakarta_persistence_api}"
    implementation "io.hypersistence:hypersistence-utils-hibernate-73:${hibernate_type}"
    implementation "com.querydsl:querydsl-jpa:${querydsl}:jakarta"
    implementation "jakarta.annotation:jakarta.annotation-api:3.0.0"
    annotationProcessor "com.querydsl:querydsl-apt:${querydsl}:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api:${jakarta_persistence_api}"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api:3.0.0"
    testAnnotationProcessor "com.querydsl:querydsl-apt:${querydsl}:jakarta"
    testAnnotationProcessor "jakarta.persistence:jakarta.persistence-api:${jakarta_persistence_api}"
    testAnnotationProcessor "jakarta.annotation:jakarta.annotation-api:3.0.0"
    api "org.assertj:assertj-core:${assertj}"
    testRuntimeOnly "com.h2database:h2:${h2}"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            "-Aquerydsl.entityAccessors=true",
            "-Aquerydsl.useFields=false",
            "-Aquerydsl.generatedAnnotationClass=jakarta.annotation.Generated",
            "-processor", "com.querydsl.apt.jpa.JPAAnnotationProcessor"
    ]
    options.encoding = "UTF-8"
}

tasks.named("sourcesJar").configure {
    dependsOn(tasks.named("compileJava"))
}

sourceSets {
    main { java.srcDir "$buildDir/generated/sources/annotationProcessor/java/main" }
    test { java.srcDir "$buildDir/generated/sources/annotationProcessor/java/test" }
}
